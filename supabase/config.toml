project_id = "muse"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

# Studio is off by default: it and pg-meta add two more containers, and on a
# machine already running another Supabase stack they routinely miss the CLI's
# health-check window and roll the whole start back. Turn it on if you want the
# table browser on :54323 and your machine has the headroom.
[studio]
enabled = false
port = 54323

# Realtime and Edge Functions are not used by Muse at all. Realtime would open a
# websocket per tab for tables nobody subscribes to, and there are no edge
# functions in this repo.
[realtime]
enabled = false

[edge_runtime]
enabled = false

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "8MiB"

# Muse resizes images in the browser before upload and serves them through its
# own authenticated proxy, so the imgproxy sidecar has nothing to do.
[storage.image_transformation]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
# Sessions persist until an explicit Sign out.
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# Verification is on in production; local dev auto-confirms so tests can run
# without an inbox round-trip.
enable_confirmations = false
secure_password_change = true

[auth.email.template.confirmation]
subject = "Confirm your Muse account"

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = "http://127.0.0.1:54321/auth/v1/callback"
skip_nonce_check = false

[analytics]
enabled = false

# ── hosted project ───────────────────────────────────────────────────────────
# Applied with `supabase config push --project-ref xukhvfdxupdswmisvurv`.
#
# A remote block overrides the base config key by key, and anything left out
# falls through to the local value. That is why every production-relevant key is
# restated here even when it matches: omitting site_url would point the hosted
# project's email links at localhost.
[remotes.production]
project_id = "xukhvfdxupdswmisvurv"

[remotes.production.auth]
site_url = "https://muse-alpha-jade.vercel.app"
additional_redirect_urls = ["https://muse-alpha-jade.vercel.app/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[remotes.production.auth.email]
enable_signup = true
double_confirm_changes = true
# Confirmation is off while the project is on Supabase's built-in mailer, which
# allows two messages an hour for the whole project — a third tester is turned
# away with "email rate limit exceeded". Off, sign-up sends no mail at all and
# is unlimited. The trade is that an address is unverified until a real mail
# provider is connected here, at which point this goes back to true.
enable_confirmations = false
secure_password_change = true

# Google is not configured on the hosted project. Stated explicitly so the base
# config's local redirect_uri is never pushed to production.
[remotes.production.auth.external.google]
enabled = false
